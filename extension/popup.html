<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickVault — Instant Copy Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header Bar -->
    <header class="popup-header">
      <div class="brand-row">
        <div class="brand-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-1.5 1.5L10 13a5 5 0 1 1-2.83-2.83l7.5-7.5" />
            <circle cx="7.5" cy="16.5" r="1.5" />
            <path d="M15.5 5.5l3 3" />
          </svg>
        </div>
        <span class="brand-title">QuickVault</span>
      </div>

      <a href="http://127.0.0.1:5173/" target="_blank" class="header-link-btn" title="Open Full Web Dashboard">
        <span>Dashboard</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      </a>
    </header>

    <!-- Profile Selector Tab Bar -->
    <div class="profile-tabs-bar" id="profileTabsContainer">
      <!-- Injected dynamically by popup.js (Personal, College, Work) -->
    </div>

    <!-- Live Search Input -->
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search links, handles, snippets..." autocomplete="off" />
    </div>

    <!-- Entries List Container -->
    <main class="entries-list" id="entriesList">
      <div class="loading-state">Loading your vault entries...</div>
    </main>

    <!-- Footer Action Bar -->
    <footer class="popup-footer">
      <span class="footer-hint">1-tap copy to clipboard</span>
      <a href="http://127.0.0.1:5173/" target="_blank" class="footer-action-link">
        + Add New Entry
      </a>
    </footer>

    <!-- Toast Notification -->
    <div class="toast-box" id="toastBox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <span id="toastText">Copied to clipboard!</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
